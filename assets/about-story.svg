<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1c14"/>
      <stop offset="100%" stop-color="#040E0A"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2318"/>
      <stop offset="100%" stop-color="#07140e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float-up {
      0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)}
    }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes spin-r { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
    @keyframes pulse {
      0%,100%{opacity:.6} 50%{opacity:1;filter:drop-shadow(0 0 6px #00E676)}
    }
    @keyframes tassel {
      0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(10deg)}
    }
    .c1{animation:float-up 4s ease-in-out infinite}
    .c2{animation:float-up 4s ease-in-out infinite .8s}
    .c3{animation:float-up 4s ease-in-out infinite 1.6s}
    .c4{animation:float-up 4s ease-in-out infinite 2.4s}
    .sp{animation:spin 20s linear infinite;transform-box:fill-box;transform-origin:center}
    .sr{animation:spin-r 15s linear infinite;transform-box:fill-box;transform-origin:center}
    .pu{animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .tsl{animation:tassel 2.5s ease-in-out infinite;transform-origin:0px 0px}
  </style>

  <rect width="960" height="360" fill="url(#bg)"/>
  <rect x="10" y="10" width="940" height="340" rx="10" fill="none" stroke="#00E676" stroke-width=".8" stroke-opacity=".2"/>
  <path d="M10 42 L10 10 L42 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M950 42 L950 10 L918 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M10 318 L10 350 L42 350" fill="none" stroke="#FFB300" stroke-width="1.5"/>
  <path d="M950 318 L950 350 L918 350" fill="none" stroke="#FFB300" stroke-width="1.5"/>

  <!-- Section title -->
  <text x="480" y="45" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
        font-size="11" font-weight="600" fill="#7A9E8A" letter-spacing="4">ABOUT</text>
  <line x1="380" y1="55" x2="580" y2="55" stroke="#00E676" stroke-width=".8" stroke-opacity=".4"/>

  <!-- Connecting line between cards -->
  <line x1="150" y1="195" x2="810" y2="195" stroke="#FFB300" stroke-width=".8" stroke-opacity=".2" stroke-dasharray="4 10"/>

  <!-- === CARD 1: UNIVERSITY (x:36) === -->
  <g class="c1" transform="translate(36, 75)">
    <rect width="200" height="240" rx="8" fill="url(#card-bg)" stroke="#00E676" stroke-width="1" stroke-opacity=".35"/>
    <g transform="translate(100, 85)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="#00E676" stroke-width=".7" stroke-opacity=".2" stroke-dasharray="4 10" class="sp"/>
      <polygon points="0,-36 36,-16 -36,-16" fill="none" stroke="#00E676" stroke-width="1.5"/>
      <rect x="-32" y="-16" width="64" height="40" rx="0" fill="none" stroke="#00E676" stroke-width="1.5"/>
      <line x1="-20" y1="-16" x2="-20" y2="24" stroke="#FFB300" stroke-width="1.2"/>
      <line x1="0" y1="-16" x2="0" y2="24" stroke="#00E676" stroke-width="1.5"/>
      <line x1="20" y1="-16" x2="20" y2="24" stroke="#FFB300" stroke-width="1.2"/>
      <line x1="-36" y1="24" x2="36" y2="24" stroke="#00E676" stroke-width="1.8"/>
      <line x1="0" y1="-36" x2="0" y2="-52" stroke="#00E676" stroke-width="1"/>
      <circle cx="0" cy="-54" r="3" fill="#00E676" class="pu" filter="url(#glow)"/>
    </g>
    <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="700" fill="#F1FAF5">Lovely Professional</text>
    <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="700" fill="#F1FAF5">University</text>
    <text x="100" y="206" text-anchor="middle" font-family="'Courier New', monospace"
          font-size="9" fill="#00E676" letter-spacing="2">PUNJAB, INDIA</text>
  </g>

  <!-- === CARD 2: DEGREE (x:262) === -->
  <g class="c2" transform="translate(262, 75)">
    <rect width="200" height="240" rx="8" fill="url(#card-bg)" stroke="#FFB300" stroke-width="1" stroke-opacity=".35"/>
    <g transform="translate(100, 85)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFB300" stroke-width=".7" stroke-opacity=".2" stroke-dasharray="4 10" class="sp"/>
      <polygon points="0,-20 36,-6 0,8 -36,-6" fill="none" stroke="#FFB300" stroke-width="2" filter="url(#glow)"/>
      <path d="M -24 -2 C -24 14, 24 14, 24 -2" fill="none" stroke="#00E676" stroke-width="1.5"/>
      <circle cx="0" cy="-6" r="2.5" fill="#F1FAF5"/>
      <g transform="translate(26, -6)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#00E676" stroke-width="1.5" class="tsl"/>
        <rect x="-3" y="20" width="6" height="6" rx="1" fill="#00E676"/>
      </g>
    </g>
    <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="700" fill="#F1FAF5">B.Tech CSE</text>
    <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="600" fill="#FFB300">AI &amp; ML</text>
    <text x="100" y="206" text-anchor="middle" font-family="'Courier New', monospace"
          font-size="9" fill="#7A9E8A" letter-spacing="2">1ST YEAR · 2026</text>
  </g>

  <!-- === CARD 3: SPECIALIZATION (x:488) === -->
  <g class="c3" transform="translate(488, 75)">
    <rect width="200" height="240" rx="8" fill="url(#card-bg)" stroke="#00E676" stroke-width="1" stroke-opacity=".35"/>
    <g transform="translate(100, 85)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFB300" stroke-width=".7" stroke-opacity=".2" stroke-dasharray="4 10" class="sr"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#00E676" stroke-width="1.6" filter="url(#glow)"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#FFB300" stroke-width=".8" stroke-opacity=".4"/>
      <line x1="-26" y1="-15" x2="26" y2="15" stroke="#FFB300" stroke-width=".8" stroke-opacity=".4"/>
      <line x1="26" y1="-15" x2="-26" y2="15" stroke="#FFB300" stroke-width=".8" stroke-opacity=".4"/>
      <circle cx="0" cy="0" r="8" fill="#00E676" fill-opacity=".15"/>
      <circle cx="0" cy="0" r="4" fill="#00E676" class="pu" filter="url(#glow)"/>
    </g>
    <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="700" fill="#F1FAF5">Artificial Intelligence</text>
    <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="600" fill="#00E676">&amp; Machine Learning</text>
    <text x="100" y="206" text-anchor="middle" font-family="'Courier New', monospace"
          font-size="9" fill="#7A9E8A" letter-spacing="2">SPECIALIZATION</text>
  </g>

  <!-- === CARD 4: LEARNING PATH (x:714) === -->
  <g class="c4" transform="translate(714, 75)">
    <rect width="200" height="240" rx="8" fill="url(#card-bg)" stroke="#FF6B35" stroke-width="1" stroke-opacity=".35"/>
    <g transform="translate(100, 85)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FF6B35" stroke-width=".7" stroke-opacity=".2" stroke-dasharray="4 10" class="sp"/>
      <polyline points="-32,24 -16,8 4,16 24,-20" fill="none" stroke="#FFB300" stroke-width="1.5"/>
      <circle cx="-32" cy="24" r="3" fill="#FFB300"/>
      <circle cx="-16" cy="8" r="3" fill="#FF6B35"/>
      <circle cx="4" cy="16" r="4" fill="#00E676" class="pu" filter="url(#glow)"/>
      <circle cx="24" cy="-20" r="10" fill="none" stroke="#00E676" stroke-width="1.5" stroke-dasharray="2 3" class="sr"/>
      <circle cx="24" cy="-20" r="4" fill="#00E676" filter="url(#glow)"/>
    </g>
    <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="700" fill="#F1FAF5">Continuous Growth</text>
    <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif"
          font-size="13" font-weight="600" fill="#FF6B35">Foundation → Frontier</text>
    <text x="100" y="206" text-anchor="middle" font-family="'Courier New', monospace"
          font-size="9" fill="#7A9E8A" letter-spacing="2">LEARNING JOURNEY</text>
  </g>
</svg>
