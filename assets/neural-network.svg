<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1c14"/>
      <stop offset="100%" stop-color="#040E0A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes sig1{0%{stroke-dashoffset:300;opacity:0}10%{opacity:1}55%{stroke-dashoffset:0;opacity:1}70%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes sig2{0%,20%{stroke-dashoffset:300;opacity:0}30%{opacity:1}75%{stroke-dashoffset:0;opacity:1}88%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes sig3{0%,42%{stroke-dashoffset:300;opacity:0}52%{opacity:1}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes pulse-n{0%,100%{r:4;opacity:.5}50%{r:6;opacity:1}}
    @keyframes pulse-active{0%,100%{r:7;opacity:.8}50%{r:9;opacity:1}}
    .s1{stroke-dasharray:22 280;animation:sig1 4.5s ease-in-out infinite;fill:none}
    .s2{stroke-dasharray:22 280;animation:sig2 4.5s ease-in-out infinite;fill:none}
    .s3{stroke-dasharray:22 280;animation:sig3 4.5s ease-in-out infinite;fill:none}
    .pn{animation:pulse-n 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pa{animation:pulse-active 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pn2{animation:pulse-n 2.8s ease-in-out infinite .7s;transform-box:fill-box;transform-origin:center}
    .pn3{animation:pulse-n 2.8s ease-in-out infinite 1.4s;transform-box:fill-box;transform-origin:center}
    .pn4{animation:pulse-n 2.8s ease-in-out infinite 2.1s;transform-box:fill-box;transform-origin:center}
  </style>

  <rect width="960" height="460" fill="url(#bg)"/>
  <rect x="10" y="10" width="940" height="440" rx="10" fill="none" stroke="#00E676" stroke-width=".8" stroke-opacity=".2"/>
  <path d="M10 42 L10 10 L42 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M950 42 L950 10 L918 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M10 418 L10 450 L42 450" fill="none" stroke="#FFB300" stroke-width="1.5"/>
  <path d="M950 418 L950 450 L918 450" fill="none" stroke="#FFB300" stroke-width="1.5"/>

  <!-- Layer labels -->
  <g font-family="'Courier New', monospace" font-size="10" text-anchor="middle" fill="#7A9E8A" letter-spacing="1">
    <text x="130" y="52">INPUT</text>
    <text x="300" y="52">HIDDEN I</text>
    <text x="480" y="52">LATENT</text>
    <text x="660" y="52">HIDDEN II</text>
    <text x="830" y="52">OUTPUT</text>
  </g>

  <!-- Guide lines -->
  <g stroke="#00E676" stroke-width=".5" stroke-opacity=".1" stroke-dasharray="4 8">
    <line x1="130" y1="65" x2="130" y2="400"/>
    <line x1="300" y1="65" x2="300" y2="400"/>
    <line x1="480" y1="65" x2="480" y2="400"/>
    <line x1="660" y1="65" x2="660" y2="400"/>
    <line x1="830" y1="65" x2="830" y2="400"/>
  </g>

  <!-- Base synapses -->
  <g fill="none" stroke="#FFB300" stroke-width=".7" stroke-opacity=".15">
    <path d="M130 140 C215 140 215 160 300 160"/><path d="M130 140 C215 140 215 210 300 210"/>
    <path d="M130 140 C215 140 215 260 300 260"/><path d="M130 185 C215 185 215 160 300 160"/>
    <path d="M130 185 C215 185 215 210 300 210"/><path d="M130 185 C215 185 215 260 300 260"/>
    <path d="M130 185 C215 185 215 310 300 310"/><path d="M130 230 C215 230 215 210 300 210"/>
    <path d="M130 230 C215 230 215 260 300 260"/><path d="M130 230 C215 230 215 310 300 310"/>
    <path d="M130 275 C215 275 215 260 300 260"/><path d="M130 275 C215 275 215 310 300 310"/>
    <path d="M130 275 C215 275 215 360 300 360"/><path d="M130 320 C215 320 215 310 300 310"/>
    <path d="M130 320 C215 320 215 360 300 360"/>
    <path d="M300 160 C390 160 390 145 480 145"/><path d="M300 160 C390 160 390 193 480 193"/>
    <path d="M300 210 C390 210 390 193 480 193"/><path d="M300 210 C390 210 390 241 480 241"/>
    <path d="M300 260 C390 260 390 241 480 241"/><path d="M300 260 C390 260 390 289 480 289"/>
    <path d="M300 310 C390 310 390 289 480 289"/><path d="M300 310 C390 310 390 337 480 337"/>
    <path d="M300 360 C390 360 390 337 480 337"/><path d="M300 360 C390 360 390 385 480 385"/>
    <path d="M480 145 C570 145 570 160 660 160"/><path d="M480 193 C570 193 570 160 660 160"/>
    <path d="M480 193 C570 193 570 210 660 210"/><path d="M480 241 C570 241 570 210 660 210"/>
    <path d="M480 241 C570 241 570 260 660 260"/><path d="M480 289 C570 289 570 260 660 260"/>
    <path d="M480 289 C570 289 570 310 660 310"/><path d="M480 337 C570 337 570 310 660 310"/>
    <path d="M480 337 C570 337 570 360 660 360"/><path d="M480 385 C570 385 570 360 660 360"/>
    <path d="M660 160 C745 160 745 185 830 185"/><path d="M660 210 C745 210 745 185 830 185"/>
    <path d="M660 210 C745 210 745 260 830 260"/><path d="M660 260 C745 260 745 185 830 185"/>
    <path d="M660 260 C745 260 745 260 830 260"/><path d="M660 260 C745 260 745 335 830 335"/>
    <path d="M660 310 C745 310 745 260 830 260"/><path d="M660 310 C745 310 745 335 830 335"/>
    <path d="M660 360 C745 360 745 260 830 260"/><path d="M660 360 C745 360 745 335 830 335"/>
  </g>

  <!-- Animated signals -->
  <path class="s1" d="M130 185 C215 185 215 260 300 260" stroke="#00E676" stroke-width="2" filter="url(#glow)"/>
  <path class="s1" d="M130 230 C215 230 215 210 300 210" stroke="#00E676" stroke-width="2" filter="url(#glow)"/>
  <path class="s2" d="M300 210 C390 210 390 241 480 241" stroke="#FFB300" stroke-width="2" filter="url(#glow)"/>
  <path class="s2" d="M300 260 C390 260 390 289 480 289" stroke="#FFB300" stroke-width="2" filter="url(#glow)"/>
  <path class="s3" d="M480 241 C570 241 570 260 660 260" stroke="#FF6B35" stroke-width="2" filter="url(#glow)"/>
  <path class="s3" d="M480 289 C570 289 570 310 660 310" stroke="#FF6B35" stroke-width="2" filter="url(#glow)"/>
  <path class="s1" d="M660 260 C745 260 745 260 830 260" stroke="#F1FAF5" stroke-width="2.5" filter="url(#glow-strong)"/>

  <!-- Input nodes (emerald) -->
  <g fill="#0a1c14" stroke="#00E676" stroke-width="1.8">
    <circle cx="130" cy="140" r="8" class="pn"/><circle cx="130" cy="185" r="8" class="pn2"/>
    <circle cx="130" cy="230" r="9" class="pn3"/><circle cx="130" cy="275" r="8" class="pn4"/>
    <circle cx="130" cy="320" r="8" class="pn"/>
  </g>
  <g fill="#00E676">
    <circle cx="130" cy="140" r="2.5"/><circle cx="130" cy="185" r="2.5"/>
    <circle cx="130" cy="230" r="3"/><circle cx="130" cy="275" r="2.5"/><circle cx="130" cy="320" r="2.5"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="9" fill="#00E676" text-anchor="end">
    <text x="118" y="143">x₀</text><text x="118" y="188">x₁</text>
    <text x="118" y="233">x₂</text><text x="118" y="278">x₃</text><text x="118" y="323">x₄</text>
  </g>

  <!-- H1 nodes (gold) -->
  <g fill="#0a1c14" stroke="#FFB300" stroke-width="1.8">
    <circle cx="300" cy="160" r="8" class="pn2"/><circle cx="300" cy="210" r="9" class="pn3"/>
    <circle cx="300" cy="260" r="9" class="pn4"/><circle cx="300" cy="310" r="8" class="pn"/>
    <circle cx="300" cy="360" r="8" class="pn2"/>
  </g>
  <g fill="#FFB300">
    <circle cx="300" cy="160" r="2.5"/><circle cx="300" cy="210" r="3"/>
    <circle cx="300" cy="260" r="3"/><circle cx="300" cy="310" r="2.5"/><circle cx="300" cy="360" r="2.5"/>
  </g>

  <!-- Latent nodes (coral, center highlighted) -->
  <g fill="#0a1c14" stroke="#FF6B35" stroke-width="1.8">
    <circle cx="480" cy="145" r="8" class="pn3"/><circle cx="480" cy="193" r="9" class="pn4"/>
    <circle cx="480" cy="241" r="11" class="pa" filter="url(#glow-strong)"/>
    <circle cx="480" cy="289" r="9" class="pn"/><circle cx="480" cy="337" r="8" class="pn2"/>
    <circle cx="480" cy="385" r="8" class="pn3"/>
  </g>
  <g fill="#FF6B35">
    <circle cx="480" cy="145" r="2.5"/><circle cx="480" cy="193" r="3"/>
    <circle cx="480" cy="289" r="3"/><circle cx="480" cy="337" r="2.5"/><circle cx="480" cy="385" r="2.5"/>
  </g>
  <circle cx="480" cy="241" r="5" fill="#fff" filter="url(#glow-strong)"/>

  <!-- H2 nodes (gold) -->
  <g fill="#0a1c14" stroke="#FFB300" stroke-width="1.8">
    <circle cx="660" cy="160" r="8" class="pn4"/><circle cx="660" cy="210" r="9" class="pn"/>
    <circle cx="660" cy="260" r="9" class="pn2"/><circle cx="660" cy="310" r="8" class="pn3"/>
    <circle cx="660" cy="360" r="8" class="pn4"/>
  </g>
  <g fill="#FFB300">
    <circle cx="660" cy="160" r="2.5"/><circle cx="660" cy="210" r="3"/>
    <circle cx="660" cy="260" r="3"/><circle cx="660" cy="310" r="2.5"/><circle cx="660" cy="360" r="2.5"/>
  </g>

  <!-- Output nodes (emerald, center bright) -->
  <g fill="#0a1c14" stroke="#00E676" stroke-width="2">
    <circle cx="830" cy="185" r="9" class="pn"/>
    <circle cx="830" cy="260" r="12" class="pa" filter="url(#glow-strong)"/>
    <circle cx="830" cy="335" r="9" class="pn2"/>
  </g>
  <circle cx="830" cy="185" r="2.5" fill="#00E676"/>
  <circle cx="830" cy="260" r="5" fill="#fff" filter="url(#glow-strong)"/>
  <circle cx="830" cy="335" r="2.5" fill="#00E676"/>
  <g font-family="'Courier New', monospace" font-size="10" text-anchor="start">
    <text x="850" y="189" fill="#7A9E8A">0.04</text>
    <text x="850" y="264" fill="#00E676" font-weight="bold">0.94</text>
    <text x="850" y="339" fill="#7A9E8A">0.02</text>
  </g>

  <!-- Info bar -->
  <rect x="20" y="410" width="920" height="34" rx="6" fill="#0A1C14" stroke="#FFB300" stroke-width=".8" stroke-opacity=".3"/>
  <g font-family="'Courier New', monospace" font-size="10" fill="#7A9E8A">
    <text x="40" y="432">Activation: GeLU</text>
    <text x="200" y="432" fill="#FFB300">·</text>
    <text x="216" y="432">Optimizer: AdamW</text>
    <text x="400" y="432" fill="#FFB300">·</text>
    <text x="416" y="432">Loss: 0.0024</text>
    <text x="560" y="432" fill="#FFB300">·</text>
    <text x="576" y="432" fill="#00E676">Forward pass: 1.3ms</text>
    <text x="760" y="432" fill="#FFB300">·</text>
    <text x="776" y="432">LR: 3e-4</text>
  </g>
</svg>
