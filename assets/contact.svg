<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1c14"/>
      <stop offset="100%" stop-color="#040E0A"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2318"/>
      <stop offset="100%" stop-color="#07140e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes pulse {
      0%,100%{opacity:.6} 50%{opacity:1;filter:drop-shadow(0 0 6px #00E676)}
    }
    .sp{animation:spin 20s linear infinite;transform-box:fill-box;transform-origin:center}
    .pu{animation:pulse 2.5s ease-in-out infinite}
  </style>

  <rect width="960" height="300" fill="url(#bg)"/>
  <rect x="10" y="10" width="940" height="280" rx="10" fill="none" stroke="#00E676" stroke-width=".8" stroke-opacity=".2"/>
  <path d="M10 42 L10 10 L42 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M950 42 L950 10 L918 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M10 258 L10 290 L42 290" fill="none" stroke="#FFB300" stroke-width="1.5"/>
  <path d="M950 258 L950 290 L918 290" fill="none" stroke="#FFB300" stroke-width="1.5"/>

