<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 56" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040E0A"/>
      <stop offset="50%" stop-color="#0a1c14"/>
      <stop offset="100%" stop-color="#040E0A"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%,100%{opacity:.6} 50%{opacity:1} }
    .bk{animation:blink 2.4s ease-in-out infinite}
  </style>

  <rect width="960" height="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="944" height="40" rx="7" fill="none" stroke="#00E676" stroke-width=".8" stroke-opacity=".2"/>

  <!-- Logo -->
  <circle cx="34" cy="28" r="4" fill="#00E676" class="bk"/>
  <text x="46" y="33" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700"
        fill="#F1FAF5" letter-spacing="1">PRABHAKAR<tspan fill="#00E676">.AI</tspan></text>

  <!-- Nav links -->
  <g font-family="'Courier New', monospace" font-size="11" font-weight="500" letter-spacing="1">
    <a href="#hero">
      <text x="430" y="33" fill="#7A9E8A">Home</text>
    </a>
    <a href="#about">
      <text x="508" y="33" fill="#7A9E8A">About</text>
    </a>
    <a href="#skills">
      <text x="590" y="33" fill="#7A9E8A">Skills</text>
    </a>
    <a href="#projects">
      <text x="672" y="33" fill="#7A9E8A">Projects</text>
    </a>
    <a href="#contact">
      <text x="772" y="33" fill="#00E676">Contact</text>
    </a>
  </g>
</svg>
