<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0d2018"/>
      <stop offset="100%" stop-color="#040E0A"/>
    </radialGradient>
    <radialGradient id="core-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00E676"/>
      <stop offset="70%" stop-color="#FFB300" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn-gh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1c14"/>
      <stop offset="100%" stop-color="#0d2318"/>
    </linearGradient>
    <linearGradient id="btn-li" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1004"/>
      <stop offset="100%" stop-color="#201506"/>
    </linearGradient>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-md">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur stdDeviation="4" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-core {
      0%,100%{r:12px;opacity:.9} 50%{r:16px;opacity:1}
    }
    @keyframes rot-cw { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes rot-ccw { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
    @keyframes flow-line {
      0%{stroke-dashoffset:300} 100%{stroke-dashoffset:0}
    }
    @keyframes blink-node {
      0%,100%{opacity:.4} 50%{opacity:1}
    }
    @keyframes float-y {
      0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}
    }
    .r-cw{transform-origin:480px 230px;animation:rot-cw 30s linear infinite}
    .r-ccw{transform-origin:480px 230px;animation:rot-ccw 20s linear infinite}
    .flow{stroke-dasharray:14 200;animation:flow-line 5s linear infinite;fill:none}
    .flow2{stroke-dasharray:10 160;animation:flow-line 3.8s linear infinite .8s;fill:none}
    .flow3{stroke-dasharray:8 180;animation:flow-line 6s linear infinite 1.6s;fill:none}
    .n1{animation:blink-node 2.4s ease-in-out infinite}
    .n2{animation:blink-node 2.4s ease-in-out infinite .6s}
    .n3{animation:blink-node 2.4s ease-in-out infinite 1.2s}
    .n4{animation:blink-node 2.4s ease-in-out infinite 1.8s}
    .hero-float{animation:float-y 5s ease-in-out infinite}
  </style>

  <rect width="960" height="580" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity=".04" stroke="#00E676" stroke-width=".7">
    <line x1="0" y1="40" x2="960" y2="40"/><line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="200" x2="960" y2="200"/><line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="280" x2="960" y2="280"/><line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="0" y1="440" x2="960" y2="440"/><line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="0" y1="520" x2="960" y2="520"/>
    <line x1="80" y1="0" x2="80" y2="580"/><line x1="160" y1="0" x2="160" y2="580"/>
    <line x1="240" y1="0" x2="240" y2="580"/><line x1="320" y1="0" x2="320" y2="580"/>
    <line x1="400" y1="0" x2="400" y2="580"/><line x1="480" y1="0" x2="480" y2="580"/>
    <line x1="560" y1="0" x2="560" y2="580"/><line x1="640" y1="0" x2="640" y2="580"/>
    <line x1="720" y1="0" x2="720" y2="580"/><line x1="800" y1="0" x2="800" y2="580"/>
    <line x1="880" y1="0" x2="880" y2="580"/>
  </g>

  <rect x="10" y="10" width="940" height="560" rx="12" fill="none" stroke="#00E676" stroke-width="1" stroke-opacity=".2"/>
  <path d="M10 50 L10 10 L50 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M950 50 L950 10 L910 10" fill="none" stroke="#00E676" stroke-width="1.5"/>
  <path d="M10 530 L10 570 L50 570" fill="none" stroke="#FFB300" stroke-width="1.5"/>
  <path d="M950 530 L950 570 L910 570" fill="none" stroke="#FFB300" stroke-width="1.5"/>

  <!-- Neural brain float group -->
  <g class="hero-float">
    <circle cx="480" cy="230" r="210" fill="none" stroke="#FFB300" stroke-width=".5" stroke-opacity=".15" stroke-dasharray="6 20"/>
    <g class="r-cw">
      <circle cx="480" cy="230" r="175" fill="none" stroke="#00E676" stroke-width=".8" stroke-opacity=".3" stroke-dasharray="12 28"/>
      <circle cx="480" cy="230" r="195" fill="none" stroke="#FFB300" stroke-width=".6" stroke-opacity=".2" stroke-dasharray="4 20"/>
      <circle cx="655" cy="230" r="3" fill="#00E676" opacity=".8"/>
      <circle cx="305" cy="230" r="3" fill="#FFB300" opacity=".8"/>
    </g>
    <g class="r-ccw">
      <circle cx="480" cy="230" r="150" fill="none" stroke="#FF6B35" stroke-width="1" stroke-opacity=".3" stroke-dasharray="30 80"/>
      <circle cx="480" cy="80" r="3.5" fill="#FF6B35" opacity=".9"/>
      <circle cx="480" cy="380" r="3.5" fill="#FF6B35" opacity=".9"/>
    </g>

    <!-- Left hemisphere -->
    <path d="M478 108 C418 106 356 132 330 176 C308 212 314 252 338 282 C356 304 382 322 418 330 C442 336 462 344 470 362 L478 362 Z"
          fill="#00E676" fill-opacity=".03" stroke="#00E676" stroke-width="1.4" stroke-opacity=".5"/>
    <!-- Right hemisphere -->
    <path d="M482 108 C542 106 604 132 630 176 C652 212 646 252 622 282 C604 304 578 322 542 330 C518 336 498 344 490 362 L482 362 Z"
          fill="#FFB300" fill-opacity=".03" stroke="#FFB300" stroke-width="1.4" stroke-opacity=".5"/>
    <line x1="480" y1="108" x2="480" y2="362" stroke="#00E676" stroke-width="1" stroke-opacity=".25" stroke-dasharray="4 8"/>

    <!-- Base mesh -->
    <g fill="none" stroke="#00E676" stroke-width=".7" stroke-opacity=".2">
      <path d="M478 112 L435 128 L382 148 L342 182 L332 228 L352 266 L392 294 L440 316 L475 325"/>
      <path d="M435 128 L452 170 L418 196 L366 218 L352 266"/>
      <path d="M452 170 L478 228 L440 256 L392 294"/>
      <path d="M418 196 L478 228 L542 196"/>
      <path d="M440 256 L478 228 L520 256"/>
      <path d="M482 112 L525 128 L578 148 L618 182 L628 228 L608 266 L568 294 L520 316 L485 325"/>
      <path d="M525 128 L508 170 L542 196 L594 218 L608 266"/>
      <path d="M508 170 L482 228 L520 256 L568 294"/>
    </g>

    <!-- Animated flows -->
    <path class="flow"  d="M478 112 L435 128 L382 148 L342 182 L332 228 L352 266 L392 294 L440 316" stroke="#00E676" stroke-width="1.8" filter="url(#glow-sm)"/>
    <path class="flow2" d="M482 112 L525 128 L578 148 L618 182 L628 228 L608 266 L568 294 L520 316" stroke="#FFB300" stroke-width="1.8" filter="url(#glow-sm)"/>
    <path class="flow3" d="M418 196 L452 170 L478 228 L508 170 L542 196" stroke="#FF6B35" stroke-width="1.5"/>
    <path class="flow"  d="M440 256 L478 228 L520 256" stroke="#F1FAF5" stroke-width="1.8" filter="url(#glow-sm)"/>

    <!-- Nodes left -->
    <circle cx="435" cy="128" r="4" fill="#00E676" class="n1" filter="url(#glow-sm)"/>
    <circle cx="382" cy="148" r="3.5" fill="#FFB300" class="n2"/>
    <circle cx="342" cy="182" r="4.5" fill="#00E676" class="n3" filter="url(#glow-sm)"/>
    <circle cx="332" cy="228" r="4" fill="#FF6B35" class="n4"/>
    <circle cx="352" cy="266" r="5" fill="#00E676" class="n1" filter="url(#glow-sm)"/>
    <circle cx="392" cy="294" r="4" fill="#FFB300" class="n2"/>
    <circle cx="440" cy="316" r="4.5" fill="#00E676" class="n3" filter="url(#glow-sm)"/>
    <circle cx="452" cy="170" r="3.5" fill="#FF6B35" class="n4"/>
    <circle cx="418" cy="196" r="4.5" fill="#00E676" class="n1" filter="url(#glow-sm)"/>
    <circle cx="440" cy="256" r="4" fill="#FFB300" class="n2"/>
    <!-- Nodes right -->
    <circle cx="525" cy="128" r="4" fill="#FFB300" class="n2" filter="url(#glow-sm)"/>
    <circle cx="578" cy="148" r="3.5" fill="#00E676" class="n3"/>
    <circle cx="618" cy="182" r="4.5" fill="#FFB300" class="n4" filter="url(#glow-sm)"/>
    <circle cx="628" cy="228" r="4" fill="#FF6B35" class="n1"/>
    <circle cx="608" cy="266" r="5" fill="#FFB300" class="n2" filter="url(#glow-sm)"/>
    <circle cx="568" cy="294" r="4" fill="#00E676" class="n3"/>
    <circle cx="520" cy="316" r="4.5" fill="#FFB300" class="n4" filter="url(#glow-sm)"/>
    <circle cx="508" cy="170" r="3.5" fill="#FF6B35" class="n1"/>
    <circle cx="542" cy="196" r="4.5" fill="#FFB300" class="n2" filter="url(#glow-sm)"/>
    <circle cx="520" cy="256" r="4" fill="#00E676" class="n3"/>
    <circle cx="480" cy="108" r="5" fill="#00E676" class="n1" filter="url(#glow-md)"/>
    <circle cx="480" cy="362" r="5" fill="#FFB300" class="n2" filter="url(#glow-md)"/>

    <!-- AI Core -->
    <circle cx="480" cy="228" r="52" fill="#00E676" fill-opacity=".05"/>
    <circle cx="480" cy="228" r="30" fill="none" stroke="#00E676" stroke-width="1.5" stroke-dasharray="8 6" class="r-cw"/>
    <circle cx="480" cy="228" r="20" fill="none" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="6 5" class="r-ccw"/>
    <circle cx="480" cy="228" r="13" fill="url(#core-r)" filter="url(#glow-lg)"/>
    <circle cx="480" cy="228" r="5" fill="#fff"/>
  </g>

  <!-- Text -->
  <text x="480" y="430" text-anchor="middle"
        font-family="'Segoe UI', Inter, sans-serif" font-size="30" font-weight="700"
        letter-spacing="6" fill="#F1FAF5">PRABHAKAR KUMAR</text>
  <text x="480" y="462" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13" font-weight="400"
        letter-spacing="4" fill="#00E676">ASPIRING AI / ML ENGINEER</text>
  <text x="480" y="490" text-anchor="middle"
        font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="300"
        letter-spacing="1" fill="#7A9E8A">B.Tech CSE (AI &amp; ML)  ·  Lovely Professional University</text>
  <line x1="340" y1="505" x2="620" y2="505" stroke="#FFB300" stroke-width=".8" stroke-opacity=".4"/>

  <!-- GitHub button -->
  <a href="https://github.com/Prabhakar289692" target="_blank">
    <g transform="translate(306, 522)">
      <rect width="156" height="38" rx="6" fill="url(#btn-gh)" stroke="#00E676" stroke-width="1.2"/>
      <g transform="translate(26,19)">
        <path d="M0-10c-5.5 0-10 4.5-10 10 0 4.4 2.9 8.2 6.9 9.5.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.5-1.1-4.5-4.8 0-1.1.4-2 1-2.6-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1 .8-.2 1.6-.3 2.5-.3s1.7.1 2.5.3c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.5 1 2.6 0 3.8-2.3 4.6-4.5 4.8.4.3.7 1 .7 2v3c0 .3.2.6.7.5C7.1 17.2 10 13.4 10 9c0-5.5-4.5-10-10-10z"
              fill="#00E676"/>
      </g>
      <text x="78" y="24" text-anchor="middle"
            font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600"
            fill="#F1FAF5" letter-spacing="1">GitHub</text>
    </g>
  </a>

  <!-- LinkedIn button -->
  <a href="https://www.linkedin.com/in/prabhakar-mishra-2a1a65395/" target="_blank">
    <g transform="translate(498, 522)">
      <rect width="156" height="38" rx="6" fill="url(#btn-li)" stroke="#FFB300" stroke-width="1.2"/>
      <g transform="translate(26,10)">
        <rect width="17" height="17" rx="3" fill="none" stroke="#FFB300" stroke-width="1.5"/>
        <circle cx="5" cy="5" r="1.5" fill="#FFB300"/>
        <line x1="5" y1="8" x2="5" y2="13" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9 13 L9 9.5 C9 8.5 10 8.5 11 8.5 C12 8.5 12 9.5 12 10 L12 13"
              fill="none" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="78" y="24" text-anchor="middle"
            font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600"
            fill="#F1FAF5" letter-spacing="1">LinkedIn</text>
    </g>
  </a>
</svg>
