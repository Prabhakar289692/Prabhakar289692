<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 60" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040E0A"/>
      <stop offset="50%" stop-color="#0a1c14"/>
      <stop offset="100%" stop-color="#040E0A"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00E676" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#FFB300" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00E676" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flow { 0%{stroke-dashoffset:100} 100%{stroke-dashoffset:0} }
    @keyframes diamond-pulse {
      0%,100%{transform:scale(1)} 50%{transform:scale(1.3);filter:drop-shadow(0 0 5px #00E676)}
    }
    .fl{stroke-dasharray:8 16;animation:flow 3s linear infinite;stroke:url(#line-grad)}
    .dp{animation:diamond-pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  </style>

  <rect width="960" height="60" fill="url(#bg)"/>
  <line x1="60" y1="30" x2="900" y2="30" stroke="#FFB300" stroke-width=".8" stroke-opacity=".2"/>
  <line x1="60" y1="30" x2="900" y2="30" stroke-width="1.5" class="fl"/>
  <polygon points="480,24 487,30 480,36 473,30" fill="#00E676" class="dp"/>
  <circle cx="480" cy="30" r="1.5" fill="#fff"/>
  <line x1="320" y1="26" x2="320" y2="34" stroke="#00E676" stroke-width="1" stroke-opacity=".35"/>
  <line x1="640" y1="26" x2="640" y2="34" stroke="#FFB300" stroke-width="1" stroke-opacity=".35"/>
</svg>
